name: Website quality check
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
permissions:
  contents: read
concurrency:
  group: website-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run release-check
      - name: Serve static output
        run: |
          python3 -m http.server 4173 --directory out >/tmp/site.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/site.log
          exit 1
      - name: Lighthouse mobile audit
        run: |
          npx --yes lighthouse@13.0.1 http://127.0.0.1:4173/ --quiet --chrome-flags="--headless --no-sandbox" --only-categories=performance,accessibility,best-practices,seo --output=json --output-path=qa/lighthouse-home.json
          npx --yes lighthouse@13.0.1 http://127.0.0.1:4173/harm-reduction/ --quiet --chrome-flags="--headless --no-sandbox" --only-categories=performance,accessibility,best-practices,seo --output=json --output-path=qa/lighthouse-harm-reduction.json
          node scripts/lighthouse-gate.mjs
