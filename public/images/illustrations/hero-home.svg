<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Community health and support illustration</title>
<desc id="desc">An original illustration of community, health, recovery and connection in a green and gold palette.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f8fcfa"/>
    <stop offset=".55" stop-color="#e9f5ef"/>
    <stop offset="1" stop-color="#e8f2f3"/>
  </linearGradient>
  <linearGradient id="hill" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#b9dfcd"/>
    <stop offset="1" stop-color="#72ad98"/>
  </linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#f5c96e"/>
    <stop offset="1" stop-color="#e5a43b"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#18352f" flood-opacity=".11"/>
  </filter>
</defs>
<rect width="1200" height="675" rx="42" fill="url(#bg)"/>
<circle cx="885" cy="146" r="82" fill="#fff7df"/>
<path d="M0 493C141 385 271 387 408 461c130 70 244 59 363-11 127-74 272-76 429 15v210H0z" fill="#d7ece2"/>
<path d="M0 545c176-113 320-86 456-19 127 63 246 69 381-5 128-70 242-49 363 13v141H0z" fill="url(#hill)" opacity=".82"/>
<path d="M640 98c48 9 93 30 128 63 36 34 58 76 68 126" fill="none" stroke="#e8b44f" stroke-width="10" stroke-linecap="round"/>
<path d="M781 129c26 4 52 16 72 35 20 19 35 44 41 69" fill="none" stroke="#e8b44f" stroke-width="10" stroke-linecap="round"/>
<path d="M861 152c-17-18-45-19-63-3-18 17-19 45-3 63l58 62 64-57c19-17 20-46 3-64-17-19-46-20-64-3z" fill="none" stroke="url(#gold)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
<!-- Taipei-inspired skyline -->
